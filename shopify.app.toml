name = "BrandSight"
client_id = "${SHOPIFY_API_KEY}"
application_url = "https://brandsight.replit.app"
embedded = true

[access_scopes]
scopes = "read_products,read_orders,read_customers"

[auth]
redirect_urls = [
  "https://brandsight.replit.app/api/auth/callback",
  "https://brandsight.replit.app/api/auth/oauth/callback"
]

[webhooks]
api_version = "2024-10"

# Compliance webhooks (mandatory for App Store apps)
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/webhooks"

# Business webhooks
[[webhooks.subscriptions]]
topics = ["orders/create", "orders/updated", "products/create", "products/update", "customers/create"]
uri = "/api/webhooks"