# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "brandsight"
client_id = ""
application_url = "https://your-app-url.onrender.com"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_orders,read_customers,read_inventory,write_script_tags"

[auth]
redirect_urls = [
  "https://your-app-url.onrender.com/auth/callback",
  "https://your-app-url.onrender.com/auth/shopify/callback",
  "https://your-app-url.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2024-10"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = [ "products/create", "products/update" ]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = [ "orders/create", "orders/updated" ]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = [ "customers/create" ]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/webhooks"

[pos]
embedded = false