# fly.toml app configuration file generated for brandsight on 2025-09-19
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "brandsight-fly"
primary_region = "iad"

[build]
  # Use Dockerfile for build process
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

# HTTP service configuration
[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  # Health check configuration
  [[services.http_checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
    protocol = "http"
    restart_limit = 0
    [services.http_checks.headers]
      X-Forwarded-Proto = "https"

# VM configuration
[machines]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Auto scaling
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Deploy configuration
[deploy]
  release_command = "echo 'Deployment successful'"
  strategy = "rolling"

# Process configuration
[processes]
  app = "node dist/index.js"